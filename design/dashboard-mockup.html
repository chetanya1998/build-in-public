<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build in Public Dashboard</title>
<style>
:root {
  --bg: #fbfaf8; --card: #ffffff; --fg: #1c1b19; --muted: #6b6860; --faint: #b9b6af; --line: #ecebe6; --hover: #f4f3ef;
  --accent: #3553d6; --accent-soft: #eef1fd; --scrim: rgba(20, 19, 17, .42);
  --s-suggested: #b9b6af; --s-draft: #c8892a; --s-approved: #4c6ef5; --s-scheduled: #8b5cf6; --s-posted: #3f9b63; --s-skipped: #d6d3cc;
  --ok: #3f9b63; --warn: #c8892a; --bad: #c4432f;
  --add: #2f8a57; --add-bg: #e8f5ec; --del: #b3412e; --del-bg: #fbe9e5;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111110; --card: #171716; --fg: #ecebe6; --muted: #8f8c85; --faint: #5c5a55; --line: #252422; --hover: #1c1c1a;
  --accent: #93a6ff; --accent-soft: #1b2038; --scrim: rgba(0, 0, 0, .6); --s-suggested: #5c5a55; --s-skipped: #3a3936;
  --ok: #6fcf97; --warn: #f0b45a; --bad: #ff8f7c;
  --add: #6fcf97; --add-bg: #13261b; --del: #ff8f7c; --del-bg: #2c1612; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111110; --card: #171716; --fg: #ecebe6; --muted: #8f8c85; --faint: #5c5a55; --line: #252422; --hover: #1c1c1a;
  --accent: #93a6ff; --accent-soft: #1b2038; --scrim: rgba(0, 0, 0, .6); --s-suggested: #5c5a55; --s-skipped: #3a3936;
  --ok: #6fcf97; --warn: #f0b45a; --bad: #ff8f7c;
  --add: #6fcf97; --add-bg: #13261b; --del: #ff8f7c; --del-bg: #2c1612; color-scheme: dark }
:root[data-theme="light"] { color-scheme: light }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh }
body.locked { overflow: hidden }
button, input, select, textarea { font: inherit; color: inherit }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
h1, h2, h3 { margin: 0; font-weight: 500; letter-spacing: -0.015em }
p { margin: 0 }
.muted { color: var(--muted) } .faint { color: var(--faint) }
.mono { font-family: var(--mono); font-size: 12px }
.mascot { display: block; position: relative; flex: none }
.mascot svg.bip { width: 100%; height: 100%; display: block; overflow: visible }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line) }
.top-in { max-width: 1160px; margin: 0 auto; padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 28px }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; white-space: nowrap; flex: none }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--hover); overflow: hidden; position: relative; flex: none }
.avatar .mascot { position: absolute; width: 44px; height: 42px; left: -7px; top: -3px }
.tabs { display: flex; gap: 22px; min-width: 0; overflow-x: auto; scrollbar-width: none; height: 100%; align-items: stretch }
.tabs::-webkit-scrollbar { display: none }
.tabs a { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; border-bottom: 1.5px solid transparent; margin-bottom: -1px }
.tabs a:hover { color: var(--fg) }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg) }
.tabs .n { font: 500 11px/1 var(--mono); color: var(--bg); background: var(--fg); border-radius: 999px; padding: 2px 5px }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; min-width: 0 }
.quiet { border: 0; background: transparent; color: var(--muted); height: 32px; padding: 0 8px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.quiet:hover, .quiet[aria-expanded="true"] { background: var(--hover); color: var(--fg) }
select.quiet { padding-right: 4px; appearance: auto }
.icon { width: 32px; padding: 0; justify-content: center }
.icon svg { width: 16px; height: 16px }
.icon .sun { display: none }
:root[data-theme="dark"] .icon .sun { display: block } :root[data-theme="dark"] .icon .moon { display: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .icon .sun { display: block } :root:not([data-theme="light"]) .icon .moon { display: none } }
.searchbox { display: none; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 0 10px; width: 200px }
.searchbox.on { display: block }
#proj-btn .lbl { max-width: 190px; overflow: hidden; text-overflow: ellipsis }
#proj-btn .pj::before { width: 7px; height: 7px }

/* popover */
.pop { position: fixed; z-index: 30; width: 290px; max-height: min(520px, calc(100vh - 80px)); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.35); padding: 6px; display: none }
.pop.on { display: block; animation: pop .14s ease-out }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) } }
.pop .opt { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px }
.pop .opt:hover { background: var(--hover) }
.pop .opt[aria-current="true"] { background: var(--hover); font-weight: 500 }
.pop .opt.sub { padding-left: 28px; color: var(--muted); font-size: 13px }
.pop .opt.sub[aria-current="true"] { color: var(--fg) }
.pop .opt .n { margin-left: auto; color: var(--faint); font: 11px var(--mono) }
.pop .opt .mode { margin-left: auto; color: var(--faint); font-size: 11.5px }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px }

/* ---------- page ---------- */
.page { max-width: 1160px; margin: 0 auto; padding: 44px 32px 96px; display: grid; gap: 44px }
.page-h { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap }
.page-h h1 { font: 400 32px/1.1 var(--serif); letter-spacing: -0.02em }
.page-h h1 .crumb { color: var(--muted) }
.page-h .right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.sec { display: grid; gap: 10px }
.sec-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line) }
.sec-h h2 { font-size: 13px; font-weight: 500 }
.sec-h .sub { font-size: 12.5px; color: var(--muted) }
.sec-h .right { margin-left: auto; font-size: 12.5px }
.link { color: var(--muted); cursor: pointer; border: 0; background: none; padding: 0 }
.link:hover { color: var(--fg) }
.btn { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--faint) }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.btn.text { border-color: transparent; background: transparent; color: var(--muted); padding: 0 8px }
.btn.text:hover { color: var(--fg); background: var(--hover) }
.btn:disabled { opacity: .5; cursor: default }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap }
.pj { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
.pj::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--pc); flex: none }
.meta { display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center }
.fmt { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap }
.fmt b { font: 600 10px/1 var(--sans); color: var(--bg); background: var(--fg); border-radius: 4px; padding: 3px 4px; letter-spacing: .01em }
.fmt.li b { background: #0a66c2; color: #fff }
.empty { display: flex; align-items: center; gap: 14px; padding: 18px 0; color: var(--muted) }
.empty .mascot { width: 64px; height: 61px }
.field { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted) }
.field > span { display: flex; justify-content: space-between }
.in { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); padding: 0 11px; color: var(--fg); font-size: 14px }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent }
select.in { padding-right: 6px }

/* rows */
.rows { display: grid }
.r { display: flex; align-items: center; gap: 14px; padding: 12px 10px; margin: 0 -10px; border-top: 1px solid transparent }
.r + .r { border-top-color: var(--line) }
.r:hover { background: var(--hover); border-radius: 10px; border-top-color: transparent } .r:hover + .r { border-top-color: transparent }
.r .main { flex: 1; min-width: 0 }
.r .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.r .acts { display: flex; gap: 4px; flex: none; opacity: 0; transition: opacity .12s }
.r:hover .acts, .r:focus-within .acts, .r .acts.always { opacity: 1 }
.r .lead { width: 44px; flex: none; color: var(--faint); font: 12px var(--mono) }
.r .num { width: 20px; flex: none; color: var(--faint); font: 12px var(--mono) }
@media (hover: none) { .r .acts { opacity: 1 } }

/* ---------- today ---------- */
.hero { display: flex; align-items: center; gap: 28px }
.hero .mascot { width: 136px; height: 129px }
.hero h1 { font: 400 34px/1.15 var(--serif); letter-spacing: -0.02em; max-width: 22ch }
.hero h1 i { color: var(--muted) }
.hero .meta { margin-top: 10px; font-size: 13px }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 48px; align-items: start }
.cols > * { min-width: 0 }
.thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.shot { display: grid; gap: 6px; font-size: 12.5px }
.shot .cap { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.thumb { display: block; width: 100%; aspect-ratio: 16/10; border-radius: 8px; overflow: hidden; background: var(--hover) }
.thumb svg { display: block; width: 100%; height: 100% }
button.thumb-btn { border: 0; padding: 0; background: none; cursor: zoom-in; display: block; width: 100%; border-radius: 8px }
button.thumb-btn:hover .thumb { box-shadow: 0 0 0 1px var(--faint) }

/* ---------- posts ---------- */
.posts { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 40px; align-items: start }
.side { position: sticky; top: 84px; display: grid; gap: 2px; font-size: 13.5px }
.side h3 { font-size: 12px; font-weight: 400; color: var(--faint); padding: 14px 10px 6px }
.side button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--muted) }
.side button:hover { background: var(--hover); color: var(--fg) }
.side button[aria-current="true"] { background: var(--hover); color: var(--fg); font-weight: 500 }
.side button.subp { padding-left: 24px; font-size: 13px }
.side button .n { margin-left: auto; color: var(--faint); font: 11px var(--mono) }
.side .add { color: var(--faint); font-size: 12.5px }
.side-select { display: none }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.chips { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--hover); flex-wrap: wrap }
.chips button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 12.5px; white-space: nowrap }
.chips button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.06) }
.chips .n { color: var(--faint); font: 11px var(--mono); margin-left: 3px }
.toggle { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--hover) }
.toggle button { border: 0; background: transparent; height: 26px; padding: 0 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px }
.toggle button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.06) }
.sub-info { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: -28px }
.board { display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr)); gap: 18px; overflow-x: auto; padding-bottom: 8px }
.col { display: grid; gap: 10px; align-content: start; min-height: 240px; border-radius: 12px; padding: 4px; margin: -4px }
.col.over { background: var(--accent-soft) }
.col-h { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 0 2px 6px }
.col-h .n { color: var(--faint); font: 12px var(--mono); margin-left: auto }
.pc { display: grid; gap: 6px; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); cursor: grab }
.pc:hover { border-color: var(--faint) }
.pc.dragging { opacity: .4 }
.pc .t { line-height: 1.35 }
.pc .x { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.pc .meta { font-size: 12px }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px }
.tbl th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12.5px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap }
.tbl td:first-child { white-space: normal; min-width: 220px }
.tbl tr:hover td { background: var(--hover) }
.tbl-wrap { overflow-x: auto; margin: 0 -12px }
.num-r { text-align: right; font-variant-numeric: tabular-nums }

/* trail */
.trail { display: grid; gap: 0; position: relative }
.trail::before { content: ""; position: absolute; left: 107px; top: 6px; bottom: 6px; width: 1px; background: var(--line) }
.tr { display: grid; grid-template-columns: 96px 22px minmax(0, 1fr); gap: 0 0; align-items: start; padding: 12px 0 }
.tr .when { text-align: right; padding-right: 14px; font-size: 12.5px; color: var(--muted); line-height: 1.35 }
.tr .when b { display: block; color: var(--fg); font-weight: 500; font-size: 13px }
.tr .node { width: 11px; height: 11px; border-radius: 50%; margin: 4px 0 0 6px; background: var(--bg); border: 2px solid var(--pc, var(--faint)); position: relative; z-index: 1 }
.tr .node.done { background: var(--pc) }
.tr .card { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; gap: 6px; margin-left: 6px }
.tr .card:hover { border-color: var(--faint) }
.tr .card.slot { border-style: dashed; background: transparent }
.tr .card .t { font-weight: 500 }
.tr .card .x { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.perf-line { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.perf-line b { color: var(--fg); font-weight: 500 }
.addrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 12px; background: var(--hover) }
.addrow .in { height: 32px; width: auto; font-size: 13px }
.addrow .lbl { font-size: 13px; color: var(--muted); margin-right: 4px }

/* ---------- post editor ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap }
.crumbs a:hover { color: var(--fg) }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); gap: 48px; align-items: start }
.editor > * { min-width: 0 }
.title-in { width: 100%; border: 0; background: transparent; padding: 0; font: 400 30px/1.2 var(--serif); letter-spacing: -0.02em; resize: none; overflow: hidden }
.title-in:focus { outline: none }
.props { display: flex; flex-wrap: wrap; gap: 4px 2px; margin: 14px 0 18px; align-items: center; font-size: 13px; color: var(--muted) }
.props label { display: inline-flex; align-items: center; gap: 2px }
.props select, .props input { border: 0; background: transparent; color: var(--fg); height: 30px; border-radius: 7px; padding: 0 6px; cursor: pointer; max-width: 230px }
.props select:hover, .props input:hover { background: var(--hover) }
.props .sep { color: var(--faint); padding: 0 4px }
.gen-hint { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--hover); font-size: 13px; color: var(--muted); margin-bottom: 4px }
.gen-hint .mascot { width: 48px; height: 46px }
.gen-hint .btn { margin-left: auto }
textarea.body { width: 100%; min-height: 340px; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 20px 0; font: 15px/1.7 var(--sans); resize: vertical }
textarea.body:focus { outline: none }
.savebar { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap }
.savebar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.unsaved { color: var(--s-draft) }
.preview { position: sticky; top: 84px; display: grid; gap: 14px; max-height: calc(100vh - 100px); overflow: auto; padding-bottom: 8px; scrollbar-width: thin }
.pv-h { display: flex; align-items: center; gap: 8px }
.pv-h .lbl { font-size: 12.5px; color: var(--muted); margin-right: auto }
.tw { padding: 14px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 8px }
.tw .who { display: flex; gap: 8px; align-items: center; font-size: 13px }
.tw .av { width: 26px; height: 26px; border-radius: 50%; background: var(--hover); overflow: hidden; position: relative; flex: none }
.tw .av .mascot { position: absolute; width: 40px; height: 38px; left: -7px; top: -3px }
.tw .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5 }
.tw .more { color: var(--accent); font-weight: 500 }
.tw .cc { font: 11px var(--mono); color: var(--faint); text-align: right }
.tw .cc.over { color: var(--bad) }
.thread { display: grid }
.thread .tw { border-radius: 0; border-top: 0 }
.thread .tw:first-child { border-radius: 12px 12px 0 0; border-top: 1px solid var(--line) }
.thread .tw:last-child { border-radius: 0 0 12px 12px }
.thread .tw:only-child { border-radius: 12px }
.cut { font: 11px var(--mono); color: var(--faint); border-top: 1px dashed var(--line); padding-top: 6px }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; background: var(--card) }
.panel h3 { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px }
.panel h3 .sub { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px }
.ms { display: grid; gap: 10px }
.m-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; font-size: 13px }
.m-row .ic { width: 8px; height: 8px; border-radius: 50%; background: var(--ok) }
.m-row.warn .ic { background: var(--warn) } .m-row.bad .ic { background: var(--bad) } .m-row.info .ic { background: var(--faint) }
.m-row .v { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.m-row .h { grid-column: 2 / -1; font-size: 12px; color: var(--muted); line-height: 1.4 }
.meter { grid-column: 2 / -1; height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 2px }
.m-row.warn .meter i { background: var(--warn) } .m-row.bad .meter i { background: var(--bad) }
.perf { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px }
.perf label { display: grid; gap: 4px; font-size: 12px; color: var(--muted) }
.perf .in { height: 32px; font-variant-numeric: tabular-nums }
.er { font-size: 13px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.er b { font: 400 24px/1 var(--serif) }
.ctx-tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none }
.ctx-tabs button { border: 0; background: none; padding: 0 0 10px; color: var(--muted); cursor: pointer; border-bottom: 1.5px solid transparent; margin-bottom: -1px; white-space: nowrap }
.ctx-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg) }
.ctx-tabs .n { color: var(--faint); font: 11px var(--mono); margin-left: 4px }
.ctx { padding-top: 16px; display: grid; gap: 12px; font-size: 13.5px }
.art { display: grid; gap: 1px; padding: 10px; margin: 0 -10px; border-radius: 8px }
.art:hover { background: var(--hover) }
.art .src { font-size: 12px; color: var(--muted) }

/* ====================================================================== generation (your agent writes; the dashboard never posts) */
function genBody(format, s, pk) {
  const p = proj(pk), hook = s?.hooks?.[0] || `Something I learned building ${p.name} this week.`;
  const sum = s?.summary || `Small steps on ${p.name}.`, t = s?.title || p.name;

  if (format === "x-long") return `${hook} Here's the whole story.\n\nWhat I was working on: ${t.toLowerCase()}.\n\nWhat went wrong: ${sum}\n\nWhat I tried first didn't work, and that's the part worth sharing: the obvious fix only moved the problem somewhere else.\n\nWhat finally worked was making the failure harmless instead of trying to prevent it.\n\nThe lesson I'm keeping: design for the second time something happens, not just the first.\n\nI'm building ${p.name} in public. Questions welcome.`;
  return `${hook}\nHere's what it taught me.\n\n${sum}\n\nThe fix was small. Finding it wasn't.\n\nLesson: design for the second time something happens, not just the first.\n\nI'm building ${p.name} in public. Follow along if you like seeing the bugs too.\n\n#buildinpublic #devlog #${p.name.replace(/[^a-z0-9]/gi, "")}`;
}

  const wire = s => {
    s.querySelector("#c-proj").onchange = e => { pk = e.target.value; sk = null; if (!allowed().includes(fmt)) fmt = allowed()[0]; s.querySelector(".sheet-body-host").innerHTML = body(); wire(s); };

  openModal(head("New post") + `<div class="sheet-body-host">${body()}</div>`, { label: "New post", wire });

function runGenerate(post, se, adaptFrom) {
  const s = $("#modal").classList.contains("on") ? $("#sheet") : null;
  const html = head(adaptFrom ? `Adapting for ${FORMATS[post.format].full}` : "Generating") + `<div class="gen">${mascotHTML({ mood: "thinking" })}<span>Your agent is writing a ${FORMATS[post.format].full} draft…</span></div>`;
  openModal(html, { label: "Generating" });
  setTimeout(() => {
    post.body = adaptFrom ? adapt(adaptFrom, post.format) : genBody(post.format, se, post.project);
    post.history.push({ at: nowStamp(), by: "agent", change: adaptFrom ? `Adapted from ${FORMATS[adaptFrom.format].full}` : "Generated", text: "" });
    closeModal(); savedBody = null; location.hash = "#/post/" + post.id; route(); toast("Draft ready. Edit it, then approve.", "proud");
  }, 1400);
}
function adapt(src, to) {
  const t = src.body.trim(), paras = splitThread(t);
  if (to === "x-short") { const first = paras[0].length > 260 ? paras[0].slice(0, 250).replace(/\s\S*$/, "") + "…" : paras[0]; return [first, ...paras.slice(1, 4).map(x => x.length > 270 ? x.slice(0, 260).replace(/\s\S*$/, "") + "…" : x)].join("\n\n"); }
  if (to === "x-long") return paras.filter(p => !/^#/.test(p)).join("\n\n") + "\n\nThat's the whole story. What would you have done?";
  const body = paras.filter(p => !/^#/.test(p)).join("\n\n");
  return (body.length > 2800 ? body.slice(0, 2780).replace(/\s\S*$/, "") + "…" : body) + "\n\n#buildinpublic #devlog";
}

  const others = Object.keys(SHOTS).filter(k => !SHOTS[k].from && k !== base).sort((a, b) => (SHOTS[b].project === bs.project) - (SHOTS[a].project === bs.project));
  const memo = {};
  const optsFor = t => memo[t] ||= Object.assign(Shots.defaults(bs, base, t), t === src.tpl ? src.opts || {} : {}, { other: (memo._other ||= others[0]) });
  let opts = optsFor(tpl), dirty = false, last = null;
  const T0 = () => Shots.TEMPLATES.find(t => t.key === tpl);
  const minis = Shots.TEMPLATES.map(t => { const o = Object.assign(Shots.defaults(bs, base, t.key), { aspect: t.key === "original" ? "auto" : "16:9", other: others[0] });
    return `<button data-tpl="${t.key}" aria-pressed="${t.key === tpl}" title="${esc(t.d)}"><span class="mini">${Shots.compose(base, t.key, o).svg.replace("<svg ", '<svg preserveAspectRatio="xMidYMid slice" ')}</span>${t.name}</button>`; }).join("");
  const optsHTML = () => {
    const T1 = T0(), f = [`<p class="tpl-d">${T1.d}</p>`];
    if (T1.opts.includes("aspect")) f.push(`<div class="field"><span>Size<span class="faint" id="asp-note">${Shots.ASPECT_NOTES[opts.aspect]}</span></span><div class="asp">${Object.keys(Shots.ASPECTS).filter(k => tpl === "original" || k !== "auto").map(k => `<button data-asp="${k}" aria-pressed="${opts.aspect === k}">${k === "auto" ? "Natural" : k}</button>`).join("")}</div></div>`);
    if (T1.opts.includes("bg")) f.push(`<div class="field"><span>Background</span><div class="sw">${Object.entries(Shots.BG).map(([k, c]) => `<button data-bg="${k}" aria-pressed="${opts.bg === k}" aria-label="${k}" title="${k}" style="background:${c.length > 1 ? `linear-gradient(135deg, ${c[0]}, ${c[1]})` : c[0]}"></button>`).join("")}</div></div>`);
    const txt = (k, label, ph) => T1.opts.includes(k) ? f.push(`<label class="field"><span>${label}</span><input class="in" data-o="${k}" value="${esc(opts[k] || "")}" placeholder="${ph}"></label>`) : 0;
    txt("title", tpl === "social" ? "Headline" : tpl === "polaroid" ? "Caption" : "Title", "Shown on the image"); txt("handle", "Handle", "@you"); txt("url", "Address", "example.com"); txt("label", "Label", "What to look at");
    if (T1.opts.includes("other")) f.push(`<label class="field"><span>Before</span><select class="in" data-o="other">${others.map(k => `<option value="${k}" ${opts.other === k ? "selected" : ""}>${esc(SHOTS[k].cap)}</option>`).join("")}</select></label>`);
    const rng = (k, label, min, max) => T1.opts.includes(k) ? f.push(`<label class="rng"><span>${label}</span><input type="range" min="${min}" max="${max}" data-o="${k}" value="${opts[k]}"><output>${opts[k]}</output></label>`) : 0;
    rng("pad", "Padding", 24, 180); rng("radius", "Corners", 0, 40);
    if (T1.opts.includes("shadow")) f.push(`<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-o="shadow" ${opts.shadow ? "checked" : ""}> Shadow</label>`);
    if (tpl === "spotlight") f.push(`<p class="faint" style="font-size:12px;margin-top:-6px">The highlighted area is preset in this mockup. In the real dashboard you drag it over the image.</p>`);
    return f.join("");
  };
  const who0 = bs.by === "agent" ? "Captured by your agent" : bs.by && bs.by.includes("Playwright") ? "Captured with Playwright" : "Captured by you";
  const html = head("Style screenshot", `<span class="muted" style="font-size:12.5px;margin-right:8px">${esc(bs.cap)}</span>`) + `<div class="styler">
      <div class="sty-main"><div class="tpl-strip" role="group" aria-label="Template">${minis}</div><div class="sty-stage" id="sty-stage"><span class="sty-size" id="sty-size"></span></div></div>
      <div class="sty-side">
        <div class="sty-src"><span class="thumb">${thumb(base, true)}</span><span><b>${esc(bs.cap)}</b>${who0}<br>${fmtDay(bs.day)}, ${bs.at} · ${bs.size}</span></div>
        <div id="sty-opts" style="display:grid;gap:16px">${optsHTML()}</div>
      </div>
    </div><div class="sheet-f"><span class="dirty-dot" id="sty-dirty" hidden><i></i>Unsaved changes</span>
      <span class="confirm" id="sty-confirm" hidden>Discard your changes? <button class="btn" id="sty-keep">Keep editing</button><button class="btn" id="sty-discard">Discard</button></span>
      <span style="flex:1"></span>
      <button class="btn text" id="sty-dl">Download PNG</button>
      ${isCopy ? `<button class="btn text" id="sty-copy">Save as copy</button>` : ""}
      <button class="btn" id="sty-save">${post ? "Save and attach" : isCopy ? "Update image" : "Save image"}</button>
      ${post ? "" : `<button class="btn primary" id="sty-post">Create post →</button>`}
    </div>`;
  openModal(html, { wide: true, cls: "sty", label: "Style screenshot", wire: s => {
    const stage = s.querySelector("#sty-stage");
    const draw = () => {
      last = Shots.compose(base, tpl, opts);
      stage.querySelector("svg")?.remove();
      // no sizing in script: the SVG keeps its viewBox and the browser scales it into the stage
      stage.insertAdjacentHTML("afterbegin", last.svg.replace(/^<svg ([^>]*?)width="\d+" height="\d+"/, `<svg role="img" aria-label="Preview, ${tplName(tpl)}, ${last.w} by ${last.h}" $1`));
      s.querySelector("#sty-size").textContent = `${last.w}×${last.h} · ${tplName(tpl)}`;
    };
    const touch = () => { dirty = true; s.querySelector("#sty-dirty").hidden = false; draw(); };
    modalGuard = () => { if (!dirty) return false; s.querySelector("#sty-dirty").hidden = true; s.querySelector("#sty-confirm").hidden = false; s.querySelector("#sty-keep").focus(); return true; };
    s.querySelector("#sty-keep").onclick = () => { s.querySelector("#sty-confirm").hidden = true; s.querySelector("#sty-dirty").hidden = false; };
    s.querySelector("#sty-discard").onclick = () => { dirty = false; closeModal(true); };
    const wireOpts = () => {
      const box = s.querySelector("#sty-opts");
      box.querySelectorAll("[data-asp]").forEach(b => b.onclick = () => { opts.aspect = b.dataset.asp; box.querySelectorAll("[data-asp]").forEach(x => x.setAttribute("aria-pressed", x === b)); s.querySelector("#asp-note").textContent = Shots.ASPECT_NOTES[opts.aspect]; touch(); });
      box.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => { opts.bg = b.dataset.bg; box.querySelectorAll("[data-bg]").forEach(x => x.setAttribute("aria-pressed", x === b)); touch(); });
      box.querySelectorAll("[data-o]").forEach(i => i.oninput = i.onchange = () => { const k = i.dataset.o; opts[k] = i.type === "checkbox" ? i.checked : i.value; if (k === "other") memo._other = i.value; const out = i.parentElement.querySelector("output"); if (out) out.textContent = i.value; touch(); });
    };
    s.querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => {
      if (tpl === b.dataset.tpl) return;
      const keep = { title: opts.title, handle: opts.handle, label: opts.label };
      tpl = b.dataset.tpl; s.querySelectorAll("[data-tpl]").forEach(x => x.setAttribute("aria-pressed", x === b));
      opts = optsFor(tpl);   // each template remembers its own settings
      ["title", "handle", "label"].forEach(k => { if (keep[k] && !memo[tpl]._edited) opts[k] = keep[k]; }); memo[tpl]._edited = true;
      s.querySelector("#sty-opts").innerHTML = optsHTML(); wireOpts(); touch();
    });
    wireOpts(); draw();
    const persist = asNew => {
      const nid = isCopy && !asNew ? id : `${base}-${tpl}-${uid()}`;
      SHOTS[nid] = Object.assign(SHOTS[nid] || {}, { kind: bs.kind, cap: `${bs.cap} · ${tplName(tpl)}`, project: bs.project, day: TODAY, at: "21:30", state: "approved", session: bs.session, by: "you", size: `${last.w}×${last.h}`, from: base, src0: src.src0 || (isCopy ? base : id), tpl, opts: Object.assign({}, opts) });
      dirty = false; return nid;
    };
    s.querySelector("#sty-dl").onclick = () => downloadShot(id, last);
    const cp = s.querySelector("#sty-copy"); if (cp) cp.onclick = () => { const nid = persist(true); closeModal(true); route(); toast("Saved as a copy", "proud"); openViewer(nid); };
    s.querySelector("#sty-save").onclick = () => {
      const nid = persist(false);
      if (post) { post.attach = [nid]; post.history.push({ at: nowStamp(), by: "you", change: `Image styled (${tplName(tpl)})` }); }
      closeModal(true); route(); toast(post ? "Saved and attached to the post" : isCopy ? "Image updated" : "Saved to Media", "proud");
      if (!post) setTimeout(() => openViewer(nid), 60);
    };
    const mp = s.querySelector("#sty-post");
    if (mp) mp.onclick = () => { const nid = persist(false); closeModal(true); route(); composeModal({ project: bs.project, session: bs.session, attach: [nid] }); };
  } });
}

/* ====================================================================== router + global actions */
function route() {
  lives.forEach(l => l.stop()); lives = [];
  let [path, qs] = (location.hash.slice(2) || "today").split("?");
  let [name, arg] = path.split("/");
  if (name === "projects") { location.replace("#/today"); setTimeout(manageModal, 50); return; }
  const q = new URLSearchParams(qs || "").get("q");
  const titles = { today: "Today", posts: "Posts", post: "Post", calendar: "Calendar", timeline: "Timeline", media: "Media" };
  document.title = (titles[name] || "Today") + " · Build in Public";
  renderTabs(name === "post" ? "posts" : name);
  $("#proj-lbl").innerHTML = projLabel();
  if (name !== "post") savedBody = null;
  const v = $("#view");
  v.innerHTML = name === "posts" ? viewPosts() : name === "post" ? viewPost(arg) : name === "calendar" ? viewCalendar()
    : name === "timeline" ? viewTimeline(q) : name === "media" ? viewMedia() : viewToday();
  if (name === "posts") wirePosts();
  if (name === "post") wirePost(arg);
  if (name === "calendar") wireCalendar();
  mountBips(v); brandBip.redraw();
}
window.addEventListener("hashchange", () => { if (!location.hash.startsWith("#/post/")) savedBody = null; closeModal(true); route(); window.scrollTo(0, 0); });
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.closest("#sheet, #proj-pop")) return;
  const d = t.dataset, Pp = id => POSTS.find(p => p.id === id);
  if (d.mode) { postsMode = d.mode; route(); }
  else if (d.ff) { fmtFilter = d.ff; route(); }
  else if (d.mf) { mediaFilter = d.mf; route(); }
  else if (d.view) openViewer(d.view);
  else if (d.style) openStyler(d.style, d.stylePost || null);
  else if ("capture" in d) captureModal();
  else if ("new" in d) composeModal();
  else if (d.newFrom) { const s = sess(d.newFrom); composeModal({ project: s.project, session: s.id }); }
  else if (d.newSub) newSubModal(d.newSub);
  else if (d.genSugg) { const s = SUGGESTED.find(x => x.n === +d.genSugg), p = POSTS.find(x => x.id === "sugg-" + s.n); p.status = "draft"; p.body = ""; p.title = s.title; runGenerate(p, sess(s.session) || SESSIONS.find(x => x.project === s.project)); }
  else if (d.copy) copy(Pp(d.copy).body, "Copied. Paste it, then mark it posted.");
  else if (d.copyThread) copy(splitThread(Pp(d.copyThread).body).map((s, i, a) => `${s} ${i + 1}/${a.length}`).join("\n\n"), "Thread copied with 1/n numbers");
  else if (d.posted) { const p = Pp(d.posted); setStatus(p, "posted"); p.link = "https://x.com/…"; route(); }
  else if (d.approve) { setStatus(Pp(d.approve), "approved"); route(); }
  else if (d.skip) { setStatus(Pp(d.skip), "skipped"); route(); }
  else if (d.shotOk) { SHOTS[d.shotOk].state = "approved"; toast("Approved. It can go in posts now."); route(); }
  else if (d.shotNo) { delete SHOTS[d.shotNo]; toast("Discarded", "idle"); route(); }
});
route();
</script>
</body>
</html>
