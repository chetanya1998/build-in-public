<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build in Public Dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --fg: #101216; --muted: #5a616d; --line: #e2e5ea;
  --ink: #2c4bd4; --ink-soft: #e9edfc; --ok: #1f8a4c; --ok-soft: #e4f4ea; --warn: #a15c00; --warn-soft: #fbefdc;
  --bad: #b42318; --bad-soft: #fde8e6; --term: #0d0f13;
  --display: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0b0d; --surface: #121419; --surface-2: #181b21; --fg: #eceef2; --muted: #8e95a2; --line: #22262d;
  --ink: #93a6ff; --ink-soft: #181d33; --ok: #4cc584; --ok-soft: #10261a; --warn: #f0b45a; --warn-soft: #2a1f0e;
  --bad: #ff8a80; --bad-soft: #2c1312; --term: #07080a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0b0d; --surface: #121419; --surface-2: #181b21; --fg: #eceef2; --muted: #8e95a2; --line: #22262d;
  --ink: #93a6ff; --ink-soft: #181d33; --ok: #4cc584; --ok-soft: #10261a; --warn: #f0b45a; --warn-soft: #2a1f0e;
  --bad: #ff8a80; --bad-soft: #2c1312; --term: #07080a; color-scheme: dark }
:root[data-theme="light"] { color-scheme: light }

* { box-sizing: border-box }
html, body { margin: 0; height: 100% }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--display); -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
a { color: inherit }
em { font-family: var(--serif); font-style: italic; font-weight: 400 }
.mono, code { font-family: var(--mono); font-size: 0.9em }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px }
h1, h2, h3 { margin: 0; letter-spacing: -0.025em; font-weight: 600; text-wrap: balance }
p { margin: 0 }

/* shell */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh }
.rail { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.02em; padding: 4px 8px 16px }
.mark { width: 22px; height: 22px; border-radius: 6px; background: var(--fg); position: relative; flex: none }
.mark::after { content: ""; position: absolute; left: 5px; right: 5px; top: 6px; height: 2px; background: var(--bg); box-shadow: 0 4px 0 var(--bg), 0 8px 0 var(--bg); border-radius: 2px }
.nav-i { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500 }
.nav-i svg { width: 17px; height: 17px; flex: none }
.nav-i:hover { color: var(--fg); background: var(--surface-2) }
.nav-i[aria-current="page"] { color: var(--fg); background: var(--ink-soft) }
.nav-i .count { margin-left: auto; font: 500 11px/1 var(--mono); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 3px 6px }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px 10px; border-top: 1px solid var(--line) }
.rail-foot b { color: var(--fg); font-weight: 600 }

.main { min-width: 0; display: flex; flex-direction: column }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px) }
.top h1 { font-size: 18px; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.mock { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 5px 8px; border-radius: 6px; white-space: nowrap }
.ctl { height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px }
.ctl:hover { border-color: var(--muted) }
select.ctl { padding-right: 6px }
.search { width: 200px }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; cursor: pointer; flex: none }
.icon-btn svg { width: 16px; height: 16px }
.icon-btn .sun { display: none }
:root[data-theme="dark"] .icon-btn .sun { display: block } :root[data-theme="dark"] .icon-btn .moon { display: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .icon-btn .sun { display: block } :root:not([data-theme="light"]) .icon-btn .moon { display: none } }

.view { padding: 24px; display: grid; gap: 24px; align-content: start; max-width: 1400px; width: 100% }

/* building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
.sec-h { display: flex; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; flex-wrap: wrap }
.today-grid > *, .editor > *, .view > *, section, .list > * { min-width: 0 }
.sec-h h2 { font-size: 15px }
.sec-h .sub { color: var(--muted); font-size: 13px }
.sec-h .right { margin-left: auto }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; text-decoration: none }
.btn:hover { border-color: var(--fg) }
.btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted) }
.btn.ghost:hover { color: var(--fg); border-color: var(--line) }
.btn svg { width: 14px; height: 14px }
.tag { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis }
.behind .blk > *, .sess-body > div > * { min-width: 0 }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.st-suggested { color: var(--muted) } .st-draft { color: var(--warn) } .st-approved { color: var(--ink) }
.st-scheduled { color: #8a4fd8 } .st-posted { color: var(--ok) } .st-skipped { color: var(--muted); opacity: .7 }
:root[data-theme="dark"] .st-scheduled { color: #c3a1ff }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-scheduled { color: #c3a1ff } }
.muted { color: var(--muted) }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.empty { padding: 20px; color: var(--muted); text-align: center; font-size: 13px }

/* today */
.today-head { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap }
.today-head h2 { font-size: clamp(24px, 3vw, 32px); line-height: 1.1 }
.stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap }
.stat { padding: 10px 14px; min-width: 110px }
.stat b { display: block; font-size: 20px; letter-spacing: -0.02em }
.stat span { font-size: 12px; color: var(--muted) }
.stat.alert b { color: var(--warn) }
.today-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start }
.list { display: grid }
.li { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: center }
.li:first-child { border-top: 0 }
.li .body { min-width: 0; flex: 1 }
.li .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.li .t a { text-decoration: none } .li .t a:hover { text-decoration: underline }
.li .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px }
.li .acts { display: flex; gap: 6px; flex: none }
.due { border-left: 3px solid #8a4fd8 }
.num { font: 500 12px/1 var(--mono); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none }
.shot-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 12px }

/* thumbs */
.thumb { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); aspect-ratio: 16/10; display: block; width: 100% }
.thumb svg { display: block; width: 100%; height: 100% }
.shot { display: grid; gap: 6px; font-size: 12px }
.shot .cap { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.shot .row { gap: 4px }

/* board */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 30px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 240px; border: 1px dashed transparent }
.col.over { border-color: var(--ink); background: var(--ink-soft) }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-size: 13px }
.col-h .n { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--muted) }
.pc { padding: 10px; display: grid; gap: 6px; cursor: grab; text-decoration: none }
.pc:hover { border-color: var(--muted) }
.pc.dragging { opacity: .4 }
.pc .t { font-weight: 500; line-height: 1.3 }
.pc .x { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.pc .thumb { aspect-ratio: 16/7 }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap }
.tbl td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: middle }
.tbl tr:first-child td { border-top: 0 }
.tbl a { text-decoration: none; font-weight: 500 } .tbl a:hover { text-decoration: underline }
.tbl-wrap { overflow-x: auto }

/* post editor */
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px }
.crumbs a { text-decoration: none } .crumbs a:hover { color: var(--fg) }
.editor { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) 300px; gap: 16px; align-items: start }
.pane { padding: 16px; display: grid; gap: 12px }
.pane h3 { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0 }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted) }
.field .ctl { width: 100%; color: var(--fg); font-size: 13px }
.title-in { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; border: 0; background: transparent; padding: 0; width: 100% }
.title-in:focus { outline: none }
textarea.md { width: 100%; min-height: 300px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 12px; font: 13px/1.6 var(--mono) }
.savebar { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted) }
.savebar .btn { margin-left: auto }
.dirty { color: var(--warn) }
.pv-tabs { display: flex; gap: 4px }
.pv { display: grid; gap: 10px }
.tweet { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--bg) }
.tweet .who { display: flex; gap: 8px; align-items: center; font-size: 13px }
.av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--ink), #8a4fd8); flex: none }
.tweet .txt { white-space: pre-wrap; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere }
.tweet .cc { font: 500 11px/1 var(--mono); color: var(--muted); text-align: right }
.tweet .cc.over { color: var(--bad) }
.li-post .txt { white-space: pre-wrap; overflow-wrap: anywhere }
.see-more { color: var(--muted); font-weight: 500 }
.cut { border-top: 1px dashed var(--line); margin: 6px 0; font: 500 10px/1 var(--mono); color: var(--muted); padding-top: 4px; letter-spacing: .05em; text-transform: uppercase }
.behind { display: grid; gap: 0 }
.behind .blk { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; align-content: start; min-width: 0 }
.behind .blk:first-child { border-top: 0 }
.behind h3 { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; font-family: var(--mono) }
.art { display: grid; gap: 2px; font-size: 13px; text-decoration: none }
.art:hover .at { text-decoration: underline }
.art .src { font: 500 11px/1 var(--mono); color: var(--muted) }
.hook { font-size: 13px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; cursor: pointer; border: 1px solid transparent; text-align: left; width: 100% }
.hook:hover { border-color: var(--line) }
.mini-shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.mini-shots button { padding: 0; border: 0; background: none; cursor: pointer; position: relative }
.mini-shots .on .thumb { outline: 2px solid var(--ink); outline-offset: 1px }
.mini-shots .pend { opacity: .45; cursor: not-allowed }
.hist { display: grid; gap: 0; font-size: 12px }
.hist button { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 6px; width: 100% }
.hist button:hover, .hist button[aria-pressed="true"] { background: var(--surface-2) }
.hist .by { font: 500 10px/1 var(--mono); color: var(--muted); margin-left: auto }
.diff { font-size: 13px; line-height: 1.6; white-space: pre-wrap; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; max-height: 220px; overflow: auto; overflow-wrap: anywhere }
.diff del { background: var(--bad-soft); color: var(--bad); text-decoration: line-through }
.diff ins { background: var(--ok-soft); color: var(--ok); text-decoration: none }

/* calendar */
.cal-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.cal-h h2 { font-size: 18px; margin-right: auto }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface) }
.cal .dow { font: 500 11px/1 var(--mono); color: var(--muted); padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em }
.day { min-height: 116px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: grid; gap: 4px; align-content: start; min-width: 0 }
.day.out { background: var(--surface-2); color: var(--muted) }
.day.over { background: var(--ink-soft) }
.day .dn { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500 }
.day.today .dn b { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 1px 7px }
.work { display: flex; gap: 2px; margin-left: auto }
.work i { width: 6px; height: 6px; border-radius: 2px; background: var(--line) }
.work i.p0 { background: color-mix(in srgb, var(--ink) 55%, transparent) }
.work i.p1 { background: color-mix(in srgb, #e0742a 60%, transparent) }
.chip { font-size: 11px; padding: 3px 6px; border-radius: 5px; background: var(--surface-2); border-left: 3px solid var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; cursor: grab; display: block }
.chip.scheduled { border-color: #8a4fd8 } .chip.posted { border-color: var(--ok) }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center }
.legend .work { margin: 0 }

/* timeline */
.tl-day { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px }
.tl-date { position: sticky; top: 70px; align-self: start; padding-top: 12px }
.tl-date b { display: block; font-size: 15px }
.tl-date span { font-size: 12px; color: var(--muted) }
.sess { overflow: hidden }
.sess + .sess { margin-top: 10px }
.sess summary { list-style: none; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; cursor: pointer; align-items: start }
.sess summary::-webkit-details-marker { display: none }
.sess .time { font: 500 12px/1.6 var(--mono); color: var(--muted) }
.sess .t { font-weight: 500 }
.sess .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; align-items: center }
.pdot { width: 8px; height: 8px; border-radius: 2px; display: inline-block }
.sess-body { border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.sess-body > div { padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.sess-body > div + div { border-left: 1px solid var(--line) }
.sess-body h3 { font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.files { font: 12px/1.7 var(--mono); color: var(--muted); overflow-wrap: anywhere }
.cmd { font: 12px/1.6 var(--mono); background: var(--term); color: #d7dbe3; border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre }
.linked { display: flex; gap: 6px; flex-wrap: wrap }

/* media */
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px }
.mcard { padding: 10px; display: grid; gap: 8px }
.mcard .cap { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mcard .meta { font-size: 12px; color: var(--muted) }
.badge-pend { color: var(--warn); background: var(--warn-soft) }
.badge-ok { color: var(--ok); background: var(--ok-soft) }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; transition: .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px) }
.toast.on { opacity: 1; transform: translate(-50%, 0) }

/* responsive */
@media (max-width: 1180px) {
  .editor { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
  .editor .behind-card { grid-column: 1 / -1 }
  .behind { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) }
  .behind .blk { border-top: 0; border-left: 1px solid var(--line) }
}
@media (max-width: 1120px) { .today-grid { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 960px) {
  .sess-body { grid-template-columns: minmax(0, 1fr) }
  .sess-body > div + div { border-left: 0; border-top: 1px solid var(--line) }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20; flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; gap: 2px }
  .rail .brand, .rail-foot { display: none }
  .nav-i { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 10px; flex: 1 0 auto; position: relative }
  .nav-i .count { position: absolute; top: 2px; right: 6px; margin: 0; padding: 2px 4px; font-size: 9px }
  .main { padding-bottom: 72px }
  .top { padding: 10px 16px; flex-wrap: wrap }
  .search { display: none }
  .view { padding: 16px }
  .editor { grid-template-columns: minmax(0, 1fr) }
  .behind .blk { border-left: 0; border-top: 1px solid var(--line) }
  .tl-day { grid-template-columns: minmax(0, 1fr); gap: 8px }
  .tl-date { position: static; padding: 0 }
  .tl-date b, .tl-date span { display: inline; margin-right: 8px }
  .day { min-height: 64px; padding: 4px }
  .chip { font-size: 0; padding: 0; height: 6px; border-left-width: 0; background: #8a4fd8 }
  .chip.posted { background: var(--ok) } .chip.draft, .chip.approved { background: var(--muted) }
  .work i { width: 4px; height: 4px }
  .stats { margin-left: 0 }
  .fields { grid-template-columns: 1fr }
}
@media (max-width: 520px) {
  .li { flex-wrap: wrap }
  .li .acts { width: 100%; padding-left: 34px }
  .sess summary { grid-template-columns: 44px minmax(0, 1fr) }
  .sess summary > :last-child { display: none }
  .mock { display: none }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><span class="mark"></span>Build in Public</div>
    <div id="nav"></div>
    <div class="rail-foot">Local · 127.0.0.1:4817<br><b>Never posts.</b> You do.</div>
  </nav>
  <div class="main">
    <header class="top">

function wireBoard() {

function setStatus(p, to) {
  if (p.status === to) return;

  if (to === "posted") p.posted_at = NOW.toISOString().slice(0, 16);
  p.history.push({ at: NOW.toISOString().slice(0, 16), by: "dashboard", change: `status ${p.status} → ${to}` });

}

/* ------------------------------------------------------------------ Post */
let pv = "x", histSel = null, savedBody = null;
function splitThread(t) { return t.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); }
function preview(p, body) {
  if (pv === "x") {

    return parts.map((t, i) => `<div class="tweet"><div class="who"><span class="av"></span><b>You</b><span class="muted">@you · ${i + 1}/${parts.length}</span></div>
      <div class="txt">${esc(t)}</div>${i === 0 && p.attach[0] ? thumb(p.attach[0]) : ""}<div class="cc ${t.length > 280 ? "over" : ""}">${t.length}/280</div></div>`).join("");
  }
  const lines = body.split("\n"); const head = lines.slice(0, 2).join("\n"), rest = lines.slice(2).join("\n");
  return `<div class="tweet li-post"><div class="who"><span class="av"></span><b>You</b><span class="muted">· now</span></div>
    <div class="txt">${esc(head)}${rest.trim() ? ` <span class="see-more">…see more</span>` : ""}</div>
    ${rest.trim() ? `<div class="cut">Hidden until "see more"</div><div class="txt muted">${esc(rest.trim())}</div>` : ""}
    ${p.attach[0] ? thumb(p.attach[0]) : ""}<div class="cc">${body.length} chars</div></div>`;
}
function wordDiff(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) { if (A[i] === B[j]) { out += esc(A[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out += `<del>${esc(A[i++])}</del>`; else out += `<ins>${esc(B[j++])}</ins>`; }
  while (i < n) out += `<del>${esc(A[i++])}</del>`; while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out;
}
function viewPost(id) {

function wirePost(id) {

/* ------------------------------------------------------------------ Calendar */
let calMonth = new Date(2026, 10, 1);
function viewCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = key(d);
    if (i >= 35 && d.getMonth() !== m) break;
    const ss = SESSIONS.filter(s => s.start.startsWith(k) && inFilter(s.project));
    const ps = POSTS.filter(p => inFilter(p.project) && ((p.status === "scheduled" && p.scheduled_for?.startsWith(k)) || (p.status === "posted" && p.posted_at?.startsWith(k))));

  }

    .map(s => s.start.slice(0, 10)).filter((d, i, a) => a.indexOf(d) === i)
    .filter(d => !POSTS.some(p => p.posted_at?.startsWith(d)));
  return `<div class="cal-h"><h2>${first.toLocaleDateString("en-US", { month: "long", year: "numeric" })}</h2>
      <button class="btn" data-cal="-1" aria-label="Previous month">←</button><button class="btn" data-cal="0">Today</button><button class="btn" data-cal="1" aria-label="Next month">→</button></div>
    <div class="legend"><span class="row"><span class="work"><i class="p0"></i><i class="p1"></i></span> a session you worked</span>

    ${busyNoPost.length ? `<div class="card" style="padding:10px 14px;font-size:13px">In the last 7 days you built on <b>${busyNoPost.length} days</b> without posting (${busyNoPost.sort().map(d => fmtDay(d).split(",")[0]).join(", ")}). <a href="#/timeline">See what you did →</a></div>` : ""}
    <div class="cal">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>`;
}
function wireCalendar() {
  document.querySelectorAll("[data-cal]").forEach(b => b.onclick = () => { const v = +b.dataset.cal; calMonth = v ? new Date(calMonth.getFullYear(), calMonth.getMonth() + v, 1) : new Date(2026, 10, 1); route(); });

            ${s.shots.length ? `<h3>Screenshots</h3><div class="mini-shots">${s.shots.map(id => `<a href="#/media" title="${esc(SHOTS[id].cap)}">${thumb(id)}</a>`).join("")}</div>` : ""}

/* ------------------------------------------------------------------ Media */
let mediaFilter = "all";

  const items = Object.entries(SHOTS).filter(([, s]) => inFilter(s.project) && (mediaFilter === "all" || s.state === mediaFilter))
    .sort((a, b) => (a[1].state === "pending" ? -1 : 0) - (b[1].state === "pending" ? -1 : 0) || b[1].day.localeCompare(a[1].day));
  return `<div class="toolbar"><div class="seg" role="group" aria-label="Filter">${["all", "pending", "approved"].map(f => `<button data-mf="${f}" aria-pressed="${mediaFilter === f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join("")}</div>
    <span class="muted" style="font-size:12px">Screenshots your agent took stay pending until you approve them.</span></div>
    <div class="media">${items.map(([id, s]) => { const used = POSTS.filter(p => p.attach.includes(id));
      return `<div class="card mcard">${thumb(id)}<div class="cap">${esc(s.cap)}</div>
        <div class="row">${pTag(s.project)}<span class="tag ${s.state === "pending" ? "badge-pend" : "badge-ok"}">${s.state}</span><span class="meta">${fmtDay(s.day)}</span></div>
        <div class="meta">${used.length ? "Used in " + used.map(p => `<a href="#/post/${p.id}">${esc(p.title.slice(0, 28))}…</a>`).join(", ") : "Not in a post"}</div>
        ${s.state === "pending" ? `<div class="row"><button class="btn solid" data-shot-ok="${id}">Approve</button><button class="btn ghost" data-shot-no="${id}">Discard</button></div>` : ""}</div>`; }).join("") || '<div class="empty">Nothing here.</div>'}</div>`;
}

/* ------------------------------------------------------------------ Projects */
function viewProjects() {
  return `<p class="muted">Only <b>content</b> projects get suggestions and posts. <b>Journal only</b> projects are logged but never used in posts. <b>Ignored</b> folders are never read.</p>
  <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th>Mode</th><th>Last session</th><th>Sessions</th><th>Posts</th><th>Last post</th></tr></thead><tbody>
  ${PROJECTS.map(p => { const ss = SESSIONS.filter(s => s.project === p.key), ps = POSTS.filter(x => x.project === p.key && x.status !== "suggested");
    const last = ps.filter(x => x.posted_at).map(x => x.posted_at).sort().pop();
    return `<tr><td><b>${esc(p.name)}</b><div class="mono muted" style="font-size:11px">${esc(p.path)}</div></td>
      <td><select class="ctl" data-mode-proj="${p.key}" aria-label="Mode for ${esc(p.name)}">${["content", "journal", "ignore"].map(m => `<option value="${m}" ${m === p.mode ? "selected" : ""}>${{ content: "Content", journal: "Journal only", ignore: "Ignored" }[m]}</option>`).join("")}</select></td>
      <td class="muted">${ss[0] ? fmtWhen(ss[0].start) : "—"}</td><td>${ss.length}</td><td>${ps.length}</td><td class="muted">${last ? fmtDay(last.slice(0, 10)) : "—"}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}

/* ------------------------------------------------------------------ router + global actions */
function route() {
  const [path, qs] = (location.hash.slice(2) || "today").split("?");
  const [name, arg] = path.split("/");
  const q = new URLSearchParams(qs || "").get("q");
  const titles = { today: "Today", posts: "Posts", post: "Post", calendar: "Calendar", timeline: "Timeline", media: "Media", projects: "Projects" };
  $("#title").textContent = name === "post" ? (POSTS.find(p => p.id === arg)?.title || "Post") : titles[name] || "Today";
  document.title = (titles[name] || "Today") + " · Build in Public";
  renderNav(name === "post" ? "posts" : name);
  if (name !== "post") savedBody = null;
  const v = $("#view");
  v.innerHTML = name === "posts" ? viewPosts() : name === "post" ? viewPost(arg) : name === "calendar" ? viewCalendar()
    : name === "timeline" ? viewTimeline(q) : name === "media" ? viewMedia() : name === "projects" ? viewProjects() : viewToday();
  if (name === "posts" && postsMode === "board") wireBoard();
  if (name === "post") wirePost(arg);
  if (name === "calendar") wireCalendar();
}
window.addEventListener("hashchange", () => { if (!location.hash.startsWith("#/post/")) savedBody = null; route(); window.scrollTo(0, 0); });

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset, P = id => POSTS.find(p => p.id === id);
  if (d.mode) { postsMode = d.mode; route(); }
  else if (d.mf) { mediaFilter = d.mf; route(); }
  else if (d.copy) copy(P(d.copy).body, "Post copied. Paste it, then mark it posted.");
  else if (d.copyThread) copy(splitThread(P(d.copyThread).body).map((s, i, a) => `${s} ${i + 1}/${a.length}`).join("\n\n"), "Thread copied with 1/n numbering");
  else if (d.posted) { const p = P(d.posted); setStatus(p, "posted"); p.link = "https://x.com/…"; route(); }
  else if (d.approve) { setStatus(P(d.approve), "approved"); route(); }
  else if (d.skip) { setStatus(P(d.skip), "skipped"); route(); }
  else if (d.prompt) copy(`write post ${d.prompt} for ${d.proj}`, `Copied “write post ${d.prompt} for ${d.proj}”. Paste it to your agent.`);
  else if (d.suggest) copy(`suggest a post from session ${d.suggest}`, "Prompt copied. Paste it to your agent.");
  else if (d.shotOk) { SHOTS[d.shotOk].state = "approved"; toast("Approved. It can now be attached to posts."); route(); }
  else if (d.shotNo) { delete SHOTS[d.shotNo]; toast("Discarded"); route(); }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.modeProj; if (!k) return;
  proj(k).mode = e.target.value; toast(`${k} → ${e.target.selectedOptions[0].text}`);
  $("#proj").innerHTML = `<option value="all">All projects</option>` + PROJECTS.filter(p => p.mode !== "ignore").map(p => `<option value="${p.key}">${esc(p.name)}</option>`).join("");
});
route();
</script>
</body>
</html>
