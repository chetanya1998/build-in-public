<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Copy Your Post</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* One post from the gist email, with a Copy button. The post is read from the link's #fragment,
   which the browser never sends to the server, so nothing about it reaches GitHub Pages. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #101216; --muted: #5a616d; --line: #e2e5ea;
  --ink: #2c4bd4; --ok: #1f8a4c; --bad: #b42318;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0b0d; --surface: #121419; --fg: #eceef2; --muted: #8e95a2; --line: #22262d;
  --ink: #93a6ff; --ok: #4cc584; --bad: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0b0d; --surface: #121419; --fg: #eceef2; --muted: #8e95a2; --line: #22262d;
  --ink: #93a6ff; --ok: #4cc584; --bad: #ff8a80; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased }
main { max-width: 680px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 48px }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
h1 { font-size: 22px; line-height: 1.25; margin: 10px 0 18px; letter-spacing: -0.01em }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line) }
.meta { font: 500 13px/1.3 var(--mono); color: var(--muted); margin-right: auto }
.post { margin: 0; padding: 18px 18px 20px; white-space: pre-wrap; word-wrap: break-word; font: 16px/1.6 var(--sans) }
button, .pill { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px;
  padding: 9px 16px; font: 600 14px/1 var(--sans); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
button.solid { background: var(--fg); color: var(--bg); border-color: var(--fg) }
button.done { background: var(--ok); border-color: var(--ok); color: #fff }
button:focus-visible, .pill:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.note { color: var(--muted); font-size: 14px; margin: 14px 2px 0 }
.empty { color: var(--muted) }
.over { color: var(--bad) }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Build Your Product in Public</div>
  <h1 id="title">Your post, ready to copy</h1>
  <div class="card">
    <div class="bar">
      <span class="meta" id="meta"></span>
      <a class="pill" id="open" hidden target="_blank" rel="noopener">Open</a>
      <button class="solid" id="copy" type="button">Copy post</button>
    </div>
    <pre class="post" id="post"></pre>
  </div>
  <p class="note">Paste it, attach the screenshot from the email if there is one, and post it yourself. This page never posts and sends nothing anywhere.</p>
</main>
<script>
(function () {
  var post = document.getElementById('post'), meta = document.getElementById('meta'),
      btn = document.getElementById('copy'), open = document.getElementById('open');
  var params = new URLSearchParams(location.hash.slice(1));
  var platform = params.get('p') || '', text = '';
  try {
    var b64 = (params.get('t') || '').replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    text = new TextDecoder().decode(bytes);
  } catch (e) { text = ''; }

  if (!text) {
    post.textContent = 'No post in this link. Open it from the "Copy post" button in your gist email.';
    post.className = 'post empty';
    btn.hidden = true;
    return;
  }
  post.textContent = text;

  // length, as the platform counts it (X counts each link as 23 characters)
  var p = platform.toLowerCase(), isX = /^x\b|twitter/.test(p), isLinkedIn = p.indexOf('linkedin') > -1;
  var chars = isX ? text.replace(/https?:\/\/\S+/g, new Array(24).join('x')).length : text.length;
  var words = text.trim().split(/\s+/).length;
  var limit = isLinkedIn ? 3000 : (isX && p.indexOf('thread') < 0 ? 280 : 0);
  meta.innerHTML = '';
  meta.appendChild(document.createTextNode((platform ? platform + ' · ' : '') + chars.toLocaleString() + ' characters · ' + words + ' words'));
  if (limit && chars > limit) {
    var over = document.createElement('span');
    over.className = 'over';
    over.textContent = ' · over ' + limit.toLocaleString();
    meta.appendChild(over);
  }

  // a link to the composer only: the text is not sent to it
  if (isX) { open.href = 'https://x.com/compose/post'; open.textContent = 'Open X'; open.hidden = false; }
  else if (isLinkedIn) { open.href = 'https://www.linkedin.com/feed/?shareActive=true'; open.textContent = 'Open LinkedIn'; open.hidden = false; }

  function copied() {
    btn.textContent = 'Copied ✓';
    btn.classList.add('done');
    setTimeout(function () { btn.textContent = 'Copy post'; btn.classList.remove('done'); }, 2200);
  }
  function fallback() {
    var range = document.createRange();
    range.selectNodeContents(post);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    try { if (document.execCommand('copy')) { copied(); return; } } catch (e) {}
    btn.textContent = 'Selected: press ⌘C or Ctrl+C';
  }
  btn.addEventListener('click', function () {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(copied, fallback);
    } else {
      fallback();
    }
  });
})();
</script>
</body>
</html>
